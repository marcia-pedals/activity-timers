# Source of truth for the Xcode project. Regenerate with `xcodegen` (from ios/)
# after adding/removing files or changing settings; don't edit the .xcodeproj by hand.
name: ActivityTimers
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4Q3J7GB2S8
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # Stay on 12.x: Firebase 13 gates Firestore behind a SwiftPM package trait,
    # which Xcode 26.2 projects can't enable (build fails with "the 'Firestore'
    # SwiftPM package trait is disabled").
    from: 12.19.3
targets:
  ActivityTimers:
    type: application
    platform: iOS
    # Shared/ is compiled into both the app and the widget extension.
    sources: [ActivityTimers, Shared]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: ActivityTimersWidgets
    entitlements:
      path: ActivityTimers/ActivityTimers.entitlements
      properties:
        # Shared storage for the Lock Screen widget's data (TodaySnapshot).
        com.apple.security.application-groups: [group.io.github.marcia-pedals.ActivityTimers]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marcia-pedals.ActivityTimers
        # iPhone only. Must be set per target: XcodeGen's iOS preset sets "1,2"
        # here, overriding the project-level value (and App Store validation then
        # demands all orientations for iPad multitasking).
        TARGETED_DEVICE_FAMILY: "1"
        # Lets shared code (e.g. StopTimerIntent) do app-only work.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAIN_APP
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GoodBadTime
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only standard HTTPS is used, which is exempt from export compliance;
        # this skips the encryption question on every TestFlight upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # A shared scheme for the app only, so Xcode doesn't auto-create one for the
    # widget extension (which can't be run on its own).
    scheme: {}

  # Live Activity UI (Lock Screen + Dynamic Island) and the Lock Screen widget.
  ActivityTimersWidgets:
    type: app-extension
    platform: iOS
    sources: [ActivityTimersWidgets, Shared]
    entitlements:
      path: ActivityTimersWidgets/ActivityTimersWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.marcia-pedals.ActivityTimers]
    info:
      path: ActivityTimersWidgets/Info.plist
      properties:
        CFBundleDisplayName: GoodBadTime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marcia-pedals.ActivityTimers.Widgets
        TARGETED_DEVICE_FAMILY: "1"
